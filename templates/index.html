<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Instantly AI Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    margin: 0;
    height: 100dvh;
    overflow: hidden;
  }
  @keyframes fadeInUp {
    0%   { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes blob {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(30px,-20px) scale(1.1); }
    66%     { transform: translate(-20px,18px) scale(0.92); }
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.35; }
    30%         { transform: translateY(-5px); opacity: 1; }
  }
  @keyframes ping {
    0%    { transform: scale(1); opacity: 0.75; }
    100%  { transform: scale(2); opacity: 0; }
  }
  .animate-fade-in-up { animation: fadeInUp 0.4s ease-out both; }
  .animate-blob        { animation: blob 18s ease-in-out infinite; }
  .animate-float       { animation: float 6s ease-in-out infinite; }
  .typing-dot          { animation: typingBounce 1.3s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.30s; }
  .ping { animation: ping 1s cubic-bezier(0,0,0.2,1) infinite; }

  .nice-scroll::-webkit-scrollbar       { width: 5px; }
  .nice-scroll::-webkit-scrollbar-track { background: transparent; }
  .nice-scroll::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.3); border-radius: 999px; }

  /* ── Layout ── */
  .app-shell {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 860px;
    margin: 0 auto;
  }
  .app-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  .chat-card {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin: 0 12px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.72);
    box-shadow: 0 8px 40px rgba(56,189,248,0.18);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .chat-messages {
    flex: 1 1 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px;
  }
  .input-bar {
    flex-shrink: 0;
    border-top: 1px solid rgba(224,242,254,0.9);
    background: rgba(255,255,255,0.88);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid #bae6fd;
    border-radius: 16px;
    background: #fff;
    padding: 5px 6px 5px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-row:focus-within {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.14);
  }
  .input-row input {
    flex: 1; border: none; outline: none;
    background: transparent;
    font-size: 15px; color: #1e293b;
    padding: 7px 0; min-width: 0;
  }
  .input-row input::placeholder { color: #94a3b8; }
  .send-btn {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border: none; cursor: pointer;
    border-radius: 12px;
    background: linear-gradient(135deg,#38bdf8,#2563eb);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 10px rgba(56,189,248,0.38);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .send-btn:hover  { box-shadow: 0 4px 14px rgba(56,189,248,0.52); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity:0.4; cursor:not-allowed; box-shadow:none; }
  .hint-text {
    text-align:center; font-size:11px; color:#94a3b8; margin-top:6px;
  }
  .app-footer {
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    padding: 6px 0 max(8px, env(safe-area-inset-bottom));
  }

  /* ── Messages ── */
  .msg-row      { display:flex; align-items:flex-start; gap:10px; margin-bottom:16px; }
  .msg-row.user { flex-direction:row-reverse; }
  .msg-col      { display:flex; flex-direction:column; min-width:0; }
  .msg-col.user { align-items:flex-end; }

  .bubble-bot, .bubble-user {
    font-size: 14px;
    line-height: 1.65;
    padding: 11px 15px;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: clamp(180px, 72vw, 520px);
  }
  .bubble-bot {
    background:#fff;
    border:1px solid #e0f2fe;
    color:#1e293b;
    border-radius:16px 16px 16px 4px;
    box-shadow:0 1px 4px rgba(0,0,0,0.06);
  }
  .bubble-user {
    background:linear-gradient(135deg,#38bdf8,#2563eb);
    color:#fff;
    border-radius:16px 16px 4px 16px;
    box-shadow:0 2px 10px rgba(56,189,248,0.28);
  }
  .avatar-bot, .avatar-user {
    flex-shrink:0;
    width:32px; height:32px;
    border-radius:50%;
    font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .avatar-bot  { background:linear-gradient(135deg,#38bdf8,#2563eb); box-shadow:0 2px 6px rgba(56,189,248,0.35); }
  .avatar-user { background:#1e293b; box-shadow:0 2px 6px rgba(0,0,0,0.18); }
  .msg-time { font-size:10px; color:#94a3b8; margin-top:3px; }

  .new-chat-btn {
    border:1px solid #bae6fd;
    background:rgba(255,255,255,0.75);
    border-radius:999px;
    padding:6px 13px;
    font-size:12px; font-weight:500; color:#0369a1;
    cursor:pointer;
    backdrop-filter:blur(8px);
    transition:background 0.2s, box-shadow 0.2s;
    white-space:nowrap;
  }
  .new-chat-btn:hover { background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.08); }

  /* ── Tablet / desktop ── */
  @media (min-width:600px) {
    .app-header  { padding:16px 24px; padding-top:max(16px,env(safe-area-inset-top)); }
    .chat-card   { margin:0 20px; border-radius:26px; }
    .chat-messages { padding:20px 22px; }
    .input-bar   { padding:12px 20px; padding-bottom:max(12px,env(safe-area-inset-bottom)); }
    .bubble-bot, .bubble-user { font-size:15px; padding:12px 16px; }
    .avatar-bot, .avatar-user { width:36px; height:36px; font-size:11px; }
    .send-btn    { width:42px; height:42px; border-radius:14px; }
    .app-footer  { font-size:12px; }
    .hint-text   { font-size:12px; }
    .new-chat-btn { font-size:13px; padding:7px 16px; }
  }
</style>
</head>
<body class="bg-gradient-to-br from-sky-100 via-blue-50 to-white">

  <!-- Background blobs -->
  <div style="pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:0;">
    <div style="position:absolute;top:-80px;left:-80px;width:280px;height:280px;border-radius:50%;background:rgba(125,211,252,0.35);filter:blur(60px);" class="animate-blob"></div>
    <div style="position:absolute;top:33%;right:-80px;width:320px;height:320px;border-radius:50%;background:rgba(147,197,253,0.3);filter:blur(60px);animation-delay:4s;" class="animate-blob"></div>
    <div style="position:absolute;bottom:-100px;left:33%;width:360px;height:360px;border-radius:50%;background:rgba(165,243,252,0.38);filter:blur(70px);animation-delay:8s;" class="animate-blob"></div>
  </div>

  <div class="app-shell" style="position:relative;z-index:1;">

    <!-- Header -->
    <header class="app-header animate-fade-in-up">
      <div style="display:flex;align-items:center;gap:11px;">
        <div style="width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(56,189,248,0.38);flex-shrink:0;" class="animate-float">
          <svg viewBox="0 0 24 24" fill="none" style="width:20px;height:20px;" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4 12a5 5 0 0 0 1 9.9"/>
            <path d="M12 13v8"/><path d="M9 18l3-3 3 3"/>
          </svg>
        </div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#0f172a;letter-spacing:-0.2px;line-height:1.2;">
            Instantly <span style="color:#0ea5e9;">Assistant</span>
          </div>
          <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b;margin-top:2px;">
            <span style="position:relative;display:inline-flex;width:7px;height:7px;">
              <span class="ping" style="position:absolute;inset:0;border-radius:50%;background:#34d399;opacity:0.7;"></span>
              <span style="position:relative;display:block;width:7px;height:7px;border-radius:50%;background:#10b981;"></span>
            </span>
            Online · replies instantly
          </div>
        </div>
      </div>
      <button id="newChatBtn" class="new-chat-btn">↻ New chat</button>
    </header>

    <!-- Chat card -->
    <main class="chat-card animate-fade-in-up">
      <div id="chatBox" class="chat-messages nice-scroll"></div>
      <div class="input-bar">
        <form id="chatForm">
          <div class="input-row">
            <svg viewBox="0 0 24 24" fill="none" style="width:17px;height:17px;flex-shrink:0;color:#38bdf8;" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>
            </svg>
            <input id="userInput" type="text" autocomplete="off" placeholder="Ask about the company…" />
            <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" style="width:17px;height:17px;" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </form>
        <p class="hint-text">
          Press <kbd style="border:1px solid #bae6fd;background:#f0f9ff;border-radius:4px;padding:1px 5px;font-family:monospace;color:#0284c7;font-size:10px;">Enter</kbd>
          to send · AI may produce inaccurate info.
        </p>
      </div>
    </main>

    <footer class="app-footer">Built with 💙 · Instantly © <span id="year"></span></footer>
  </div>

<script>
const chatBox    = document.getElementById('chatBox');
const userInput  = document.getElementById('userInput');
const chatForm   = document.getElementById('chatForm');
const newChatBtn = document.getElementById('newChatBtn');
document.getElementById('year').textContent = new Date().getFullYear();

function fmt(d){ return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function scroll(){ chatBox.scrollTo({top:chatBox.scrollHeight,behavior:'smooth'}); }

function renderMessage(role, text, time){
  const isUser = role === 'user';
  const row = document.createElement('div');
  row.className = 'msg-row' + (isUser ? ' user' : '');
  row.innerHTML = `
    <div class="${isUser?'avatar-user':'avatar-bot'}">${isUser?'You':'AI'}</div>
    <div class="msg-col${isUser?' user':''}">
      <div class="${isUser?'bubble-user':'bubble-bot'}">${esc(text)}</div>
      <span class="msg-time">${time}</span>
    </div>`;
  chatBox.appendChild(row);
  scroll();
}

function showTyping(){
  const el = document.createElement('div');
  el.id = 'typingIndicator';
  el.className = 'msg-row';
  el.innerHTML = `
    <div class="avatar-bot">AI</div>
    <div class="bubble-bot" style="padding:10px 14px;display:flex;flex-direction:row;align-items:center;gap:5px;">
      <span class="typing-dot" style="display:block;width:7px;height:7px;border-radius:50%;background:#38bdf8;flex-shrink:0;"></span>
      <span class="typing-dot" style="display:block;width:7px;height:7px;border-radius:50%;background:#38bdf8;flex-shrink:0;"></span>
      <span class="typing-dot" style="display:block;width:7px;height:7px;border-radius:50%;background:#38bdf8;flex-shrink:0;"></span>
    </div>`;
  chatBox.appendChild(el);
  scroll();
}
function hideTyping(){ const el=document.getElementById('typingIndicator'); if(el) el.remove(); }

async function send(text){
  const trimmed = text.trim();
  if(!trimmed) return;
  renderMessage('user', trimmed, fmt(new Date()));
  userInput.value = '';
  showTyping();
  try {
    const res  = await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:trimmed})});
    const data = await res.json();
    hideTyping();
    renderMessage('bot', data.response||('ERROR: '+data.error), fmt(new Date()));
  } catch(e){
    hideTyping();
    renderMessage('bot','Failed to connect to server.', fmt(new Date()));
  }
}

chatForm.addEventListener('submit', e=>{ e.preventDefault(); send(userInput.value); });
newChatBtn.addEventListener('click', ()=>{ chatBox.innerHTML=''; renderMessage('bot','New conversation started.',fmt(new Date())); });

/* Prevent mobile keyboard from hiding the input bar */
if('visualViewport' in window){
  window.visualViewport.addEventListener('resize', ()=>{
    document.querySelector('.app-shell').style.height = window.visualViewport.height+'px';
    scroll();
  });
}

renderMessage('bot','Ask anything about the company.', fmt(new Date()));
</script>
</body>
</html>
