<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instantly AI Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes blob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.15); }
    66% { transform: translate(-30px, 25px) scale(0.9); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .animate-fade-in-up { animation: fadeInUp 0.45s ease-out both; }
  .animate-pop { animation: pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .animate-blob { animation: blob 18s ease-in-out infinite; }
  .animate-float { animation: float 6s ease-in-out infinite; }
  .typing-dot { animation: typingBounce 1.3s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  /* Pretty scrollbar */
  .nice-scroll::-webkit-scrollbar { width: 8px; }
  .nice-scroll::-webkit-scrollbar-track { background: transparent; }
  .nice-scroll::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.35);
    border-radius: 999px;
  }
  .nice-scroll::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }

  /* Keep text crisp on gradients */
  .chat-text { white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body class="relative min-h-screen overflow-hidden bg-gradient-to-br from-sky-100 via-blue-50 to-white text-slate-800">

  <!-- Animated background blobs -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-24 -left-24 h-80 w-80 rounded-full bg-sky-300/40 blur-3xl animate-blob"></div>
    <div class="absolute top-1/3 -right-24 h-96 w-96 rounded-full bg-blue-300/40 blur-3xl animate-blob" style="animation-delay: 4s;"></div>
    <div class="absolute -bottom-32 left-1/3 h-[28rem] w-[28rem] rounded-full bg-cyan-200/50 blur-3xl animate-blob" style="animation-delay: 8s;"></div>
  </div>

  <div class="relative mx-auto flex min-h-screen max-w-4xl flex-col px-4 py-6 sm:px-6 sm:py-10">

    <!-- Header -->
    <header class="mb-6 flex items-center justify-between animate-fade-in-up">
      <div class="flex items-center gap-3">
        <div class="relative flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-400 to-blue-600 shadow-lg shadow-sky-300/50 animate-float">
          <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6 text-white" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4 12a5 5 0 0 0 1 9.9" />
            <path d="M12 13v8" />
            <path d="M9 18l3-3 3 3" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-slate-900 sm:text-xl">
            Nimbus <span class="text-sky-500">Assistant</span>
          </h1>
          <p class="flex items-center gap-1.5 text-xs text-slate-500 sm:text-sm">
            <span class="relative flex h-2 w-2">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
            </span>
            Online · replies instantly
          </p>
        </div>
      </div>
      <button id="newChatBtn" class="rounded-full border border-sky-200 bg-white/70 px-3 py-1.5 text-xs font-medium text-sky-700 backdrop-blur transition hover:bg-white hover:shadow-md sm:text-sm" title="Clear chat">
        ↻ New chat
      </button>
    </header>

    <!-- Chat card -->
    <main class="flex flex-1 flex-col overflow-hidden rounded-3xl border border-white/60 bg-white/70 shadow-2xl shadow-sky-200/60 backdrop-blur-xl animate-fade-in-up">

      <!-- Messages -->
      <div id="chatBox" class="nice-scroll flex-1 space-y-4 overflow-y-auto px-4 py-6 sm:px-6" style="min-height: 55vh; max-height: 65vh;">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Input -->
      <form id="chatForm" class="border-t border-sky-100/80 bg-white/80 p-3 backdrop-blur sm:p-4">
        <div class="flex items-center gap-2 rounded-2xl border border-sky-200 bg-white px-3 py-2 shadow-inner shadow-sky-50 transition focus-within:border-sky-400 focus-within:ring-4 focus-within:ring-sky-100">
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5 flex-shrink-0 text-sky-400" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <path d="M12 19v3" />
          </svg>
          <input
            id="userInput"
            type="text"
            autocomplete="off"
            placeholder="Ask about the company..."
            class="flex-1 bg-transparent px-1 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none sm:text-base"
          />
          <button
            id="sendBtn"
            type="submit"
            class="group relative flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 text-white shadow-lg shadow-sky-300/50 transition hover:shadow-sky-400/60 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none sm:h-11 sm:w-11"
            aria-label="Send message"
          >
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5 transition group-hover:translate-x-0.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13" />
              <path d="M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </div>
        <p class="mt-2 px-2 text-center text-[11px] text-slate-400 sm:text-xs">
          Press <kbd class="rounded border border-sky-200 bg-sky-50 px-1.5 py-0.5 font-mono text-sky-600">Enter</kbd> to send · Nimbus AI may produce inaccurate info.
        </p>
      </form>
    </main>

    <footer class="mt-4 text-center text-xs text-slate-500 animate-fade-in-up">
      Built with 💙 · Nimbus © <span id="year"></span>
    </footer>
  </div>

<script>

const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const chatForm = document.getElementById('chatForm');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');

document.getElementById('year').textContent = new Date().getFullYear();

function formatTime(d) {
    return d.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });
}

function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    }[c]));
}

function scrollToBottom() {
    chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: 'smooth'
    });
}

function avatarHTML(role) {

    if(role === 'user') {

        return `
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-800 text-xs font-bold text-white">
            You
        </div>
        `;
    }

    return `
    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-sky-400 to-blue-600 text-white">
        AI
    </div>
    `;
}

function renderMessage(role, text, time) {


    const isUser = role === 'user';

    const bubbleClasses = isUser
        ? 'rounded-br-sm bg-gradient-to-br from-sky-500 to-blue-600 text-white'
        : 'rounded-bl-sm border border-sky-100 bg-white text-slate-800';

    const el = document.createElement('div');

    el.className = `flex items-end gap-2 mb-4 ${isUser ? 'justify-end' : 'justify-start'}`;

    el.innerHTML = `

        ${!isUser ? avatarHTML('bot') : ''}

        <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'}">

            <div class="
                inline-block
                max-w-[320px]
                sm:max-w-[450px]
                break-words
                whitespace-pre-wrap
                rounded-2xl
                px-4
                py-3
                text-sm
                leading-relaxed
                shadow-sm
                ${bubbleClasses}
            ">
                ${escapeHtml(text)}
            </div>

            <span class="mt-1 px-1 text-[10px] text-slate-400">
                ${time}
            </span>

        </div>

        ${isUser ? avatarHTML('user') : ''}

    `;

    chatBox.appendChild(el);

    scrollToBottom();
}

function showTyping() {

    const el = document.createElement('div');

    el.id = 'typingIndicator';

    el.className = 'flex items-end gap-2 mb-4';

    el.innerHTML = `

        ${avatarHTML('bot')}

        <div class="flex items-center gap-1.5 rounded-2xl rounded-bl-sm border border-sky-100 bg-white px-4 py-3 shadow-sm">

            <span class="typing-dot block h-2 w-2 rounded-full bg-sky-400"></span>

            <span class="typing-dot block h-2 w-2 rounded-full bg-sky-400"></span>

            <span class="typing-dot block h-2 w-2 rounded-full bg-sky-400"></span>

        </div>
    `;

    chatBox.appendChild(el);

    scrollToBottom();
}

function hideTyping() {

    const el = document.getElementById('typingIndicator');

    if(el) el.remove();
}

async function send(text) {

    const trimmed = text.trim();

    if(!trimmed) return;

    renderMessage('user', trimmed, formatTime(new Date()));

    userInput.value = '';

    showTyping();

    try {

        const response = await fetch('/chat', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                message: trimmed
            })
        });

        const data = await response.json();

        hideTyping();

        if(data.response) {

            renderMessage(
                'bot',
                data.response,
                formatTime(new Date())
            );

        } else {

            renderMessage(
                'bot',
                'ERROR: ' + data.error,
                formatTime(new Date())
            );
        }

    } catch(error) {

        hideTyping();

        renderMessage(
            'bot',
            'Failed to connect to server.',
            formatTime(new Date())
        );
    }
}


// FORM SUBMIT
chatForm.addEventListener('submit', (e) => {

    e.preventDefault();

    send(userInput.value);
});


// CLEAR CHAT
newChatBtn.addEventListener('click', () => {

    chatBox.innerHTML = '';

    renderMessage(
        'bot',
        'New conversation started.',
        formatTime(new Date())
    );
});


// INITIAL MESSAGE
renderMessage(
    'bot',
    'Ask anything about the company.',
    formatTime(new Date())
);

</script>
</body>
</html>
