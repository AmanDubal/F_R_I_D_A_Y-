
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  .wrap{min-height:560px;padding:1.5rem 1rem;background:linear-gradient(145deg,#e0f2fe 0%,#f0f9ff 60%,#ffffff 100%);border-radius:var(--border-radius-lg)}
  .card{background:#ffffff;border-radius:20px;border:0.5px solid #bae6fd;overflow:hidden;display:flex;flex-direction:column;height:520px;max-width:680px;margin:0 auto}
  .header{background:#0ea5e9;padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .header-icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
  .header-text h2{font-size:16px;font-weight:500;color:#fff;letter-spacing:0.01em}
  .header-text p{font-size:12px;color:rgba(255,255,255,0.8);margin-top:2px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;margin-left:auto;box-shadow:0 0 0 2px rgba(255,255,255,0.3)}
  .chat-box{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:10px;background:#f8fafc}
  .chat-box::-webkit-scrollbar{width:4px}
  .chat-box::-webkit-scrollbar-track{background:transparent}
  .chat-box::-webkit-scrollbar-thumb{background:#bae6fd;border-radius:4px}
  .msg{padding:10px 14px;border-radius:16px;max-width:78%;font-size:14px;line-height:1.5;word-break:break-word}
  .msg.user{background:#0ea5e9;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .msg.bot{background:#ffffff;color:#0c4a6e;border:0.5px solid #bae6fd;border-bottom-left-radius:4px;align-self:flex-start}
  .msg.typing{background:#ffffff;border:0.5px solid #bae6fd;align-self:flex-start}
  .dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7dd3fc;margin:0 2px;animation:bounce 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
  .input-row{padding:.75rem 1rem;background:#fff;border-top:0.5px solid #e0f2fe;display:flex;gap:8px;flex-shrink:0;align-items:center}
  .msg-input{flex:1;padding:10px 14px;border:1px solid #bae6fd;border-radius:24px;font-size:14px;color:#0c4a6e;background:#f0f9ff;outline:none;transition:border 0.2s}
  .msg-input::placeholder{color:#7dd3fc}
  .msg-input:focus{border-color:#0ea5e9;background:#fff}
  .send-btn{width:40px;height:40px;border-radius:50%;background:#0ea5e9;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s,transform 0.1s;flex-shrink:0}
  .send-btn:hover{background:#0284c7}
  .send-btn:active{transform:scale(0.94)}
  .send-btn i{color:#fff;font-size:18px}
  .welcome{text-align:center;padding:2rem 1rem;color:#7dd3fc;font-size:13px}
  .welcome i{font-size:36px;color:#bae6fd;display:block;margin-bottom:.5rem}
  .suggestion-row{display:flex;flex-wrap:wrap;gap:6px;padding:.5rem 1rem .75rem;background:#fff;justify-content:center}
  .chip{padding:5px 12px;border-radius:20px;background:#e0f2fe;border:0.5px solid #bae6fd;font-size:12px;color:#0369a1;cursor:pointer;transition:background 0.15s}
  .chip:hover{background:#bae6fd}
  @media(max-width:480px){.card{height:480px}.msg{max-width:90%;font-size:13px}}
</style>
<h2 class="sr-only">Company AI assistant chat interface demo</h2>
<div class="wrap">
  <div class="card">
    <div class="header">
      <div class="header-icon"><i class="ti ti-robot" aria-hidden="true"></i></div>
      <div class="header-text">
        <h2>Company AI Assistant</h2>
        <p>Always here to help</p>
      </div>
      <div class="status-dot" title="Online"></div>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="welcome">
        <i class="ti ti-message-chatbot" aria-hidden="true"></i>
        Ask me anything about the company!
      </div>
    </div>
    <div class="suggestion-row" id="chips">
      <button class="chip" onclick="quickSend('What are your business hours?')">Business hours</button>
      <button class="chip" onclick="quickSend('Tell me about your services')">Our services</button>
      <button class="chip" onclick="quickSend('How do I contact support?')">Contact support</button>
    </div>
    <div class="input-row">
      <input class="msg-input" id="userInput" type="text" placeholder="Ask about the company…" onkeydown="if(event.key==='Enter')sendMsg()" aria-label="Type your message" />
      <button class="send-btn" onclick="sendMsg()" aria-label="Send message"><i class="ti ti-send"></i></button>
    </div>
  </div>
</div>
<script>
const box = document.getElementById('chatBox');
const input = document.getElementById('userInput');

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg typing';
  d.id = 'typing';
  d.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('chips').style.display = 'none';
  addMsg(text, 'user');
  showTyping();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();
    addMsg(data.response || ('Error: ' + data.error), 'bot');
  } catch {
    removeTyping();
    addMsg('Unable to connect to the server. Please try again.', 'bot');
  }
}

function quickSend(text) {
  input.value = text;
  sendMsg();
}
</script>
