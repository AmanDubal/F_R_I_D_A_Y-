<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>F_R_I_D_A_Y AI</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      width:400px;
      height:650px;
      background:#111827;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
    }

    .header{
      padding:20px;
      text-align:center;
      border-bottom:1px solid #1f2937;
    }

    .header h1{
      color:#22c55e;
      letter-spacing:4px;
    }

    .chat-box{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .message{
      padding:12px 15px;
      border-radius:15px;
      max-width:80%;
      line-height:1.5;
      word-wrap:break-word;
    }

    .user{
      background:#22c55e;
      color:black;
      align-self:flex-end;
    }

    .ai{
      background:#1f2937;
      align-self:flex-start;
    }

    .bottom{
      display:flex;
      padding:15px;
      gap:10px;
      border-top:1px solid #1f2937;
    }

    input{
      flex:1;
      padding:14px;
      border:none;
      outline:none;
      border-radius:10px;
      background:#1f2937;
      color:white;
      font-size:15px;
    }

    button{
      padding:14px 18px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      font-weight:bold;
      cursor:pointer;
    }

    .start-screen{
      position:absolute;
      width:100%;
      height:100%;
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      gap:20px;
      z-index:100;
    }

    .start-screen h1{
      color:#22c55e;
      font-size:40px;
      letter-spacing:5px;
    }

    .start-btn{
      width:180px;
      height:55px;
      font-size:18px;
    }

  </style>
</head>

<body>

<div class="start-screen" id="startScreen">

  <h1>F_R_I_D_A_Y</h1>

  <button class="start-btn" onclick="startAI()">
    Start
  </button>

</div>

<div class="container">

  <div class="header">
    <h1>F_R_I_D_A_Y</h1>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="bottom">

    <input 
      type="text" 
      id="userInput" 
      placeholder="Type your message..."
    >

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

</div>

<script>

const URL = "https://aicallingagent-production-b135.up.railway.app/chat";

const chatBox = document.getElementById("chatBox");

function speak(text){

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 1;

  window.speechSynthesis.speak(speech);
}

function addMessage(text, type){

  const div = document.createElement("div");

  div.classList.add("message");
  div.classList.add(type);

  div.innerText = text;

  chatBox.appendChild(div);

  chatBox.scrollTop = chatBox.scrollHeight;
}

function startAI(){

  document.getElementById("startScreen").style.display = "none";

  const greeting = "Hello! How may I help you today?";

  addMessage(greeting, "ai");

  speak(greeting);
}

async function sendMessage(){

  const input = document.getElementById("userInput");

  const message = input.value.trim();

  if(message === "") return;

  addMessage(message, "user");

  input.value = "";

  try{

    const response = await fetch(URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:message
      })

    });

    const data = await response.json();

    console.log(data);

    const aiResponse =
      data.response ||
      data.message ||
      data.reply ||
      "No response from AI";

    addMessage(aiResponse, "ai");

    speak(aiResponse);

  }
  catch(error){

    console.log(error);

    addMessage("Backend Server Error", "ai");

    speak("Backend Server Error");
  }
}

document.getElementById("userInput")
.addEventListener("keypress", function(e){

  if(e.key === "Enter"){
    sendMessage();
  }
});

</script>

</body>
</html>
